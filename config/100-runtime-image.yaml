# The Kafka runtime ships as a single container image that func injects as a
# sidecar next to the user's function; there is no standalone Deployment. This
# ConfigMap exists so the release pipeline has a resolvable artifact: on release
# `ko resolve` rewrites the ko:// reference below to the published image digest,
# which both publishes the image and records a signed, pinned reference in the
# release artifact. This mirrors how Knative Serving publishes its queue-proxy
# sidecar image (config/core/configmaps/deployment.yaml: queue-sidecar-image).
apiVersion: v1
kind: ConfigMap
metadata:
  name: func-kafka-runtime-image
  labels:
    app.kubernetes.io/name: func-adapter-kafka
    app.kubernetes.io/component: kafka-runtime
data:
  # Published image reference for the language-agnostic Kafka runtime. Consumers
  # (e.g. func) read the released digest from here instead of hard-coding a tag.
  runtime-image: ko://knative.dev/func-adapter-kafka/cmd/fkafka-runtime
